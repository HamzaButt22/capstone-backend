<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .glowA   { fill: #d9973f; opacity: 0.38; }
      .glowB   { fill: #3fc9c0; opacity: 0.30; }
      .panelFill   { fill: #ffffff; fill-opacity: 0.08; }
      .panelStroke { stroke: #ffffff; stroke-opacity: 0.16; }
      .catchLight  { stroke: #ffffff; stroke-opacity: 0.22; }
      .titleText   { fill: #f1efe9; }
      .subText     { fill: #c7c2b8; }
      .metaText    { fill: #948f83; }
      .accentBar   { fill: #d9973f; opacity: 0.85; }
      .grain       { opacity: 0.02; }
      .shimmerStop { stop-color: #ffffff; }

      @media (prefers-color-scheme: light) {
        .glowA   { opacity: 0.15; }
        .glowB   { opacity: 0.13; }
        .panelFill   { fill: #000000; fill-opacity: 0.045; }
        .panelStroke { stroke: #000000; stroke-opacity: 0.22; }
        .catchLight  { stroke: #000000; stroke-opacity: 0.12; }
        .titleText   { fill: #201f1c; }
        .subText     { fill: #4c473e; }
        .metaText    { fill: #7a756a; }
        .grain       { opacity: 0.012; }
        .shimmerStop { stop-color: #000000; }
      }
    </style>

    <filter id="heavyBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <clipPath id="panelClipBack">
      <rect x="90" y="60" width="1020" height="200" rx="24"/>
    </clipPath>

    <linearGradient id="shimmerGradBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop class="shimmerStop" offset="0%" stop-opacity="0"/>
      <stop class="shimmerStop" offset="50%" stop-opacity="0.14"/>
      <stop class="shimmerStop" offset="100%" stop-opacity="0"/>
    </linearGradient>

    <filter id="grainFilterBack">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.5
                0 0 0 0 0.5
                0 0 0 0 0.5
                0 0 0 0.06 0"/>
    </filter>
  </defs>

  <circle class="glowA" cx="230" cy="100" r="190" filter="url(#heavyBlur)"/>
  <circle class="glowB" cx="960" cy="230" r="210" filter="url(#heavyBlur)"/>
  <circle class="glowA" cx="700" cy="40" r="120" filter="url(#heavyBlur)" opacity="0.5"/>

  <rect class="panelFill panelStroke" x="90" y="60" width="1020" height="200" rx="24" stroke-width="1.4"/>

  <g clip-path="url(#panelClipBack)">
    <rect class="grain" x="90" y="60" width="1020" height="200" filter="url(#grainFilterBack)"/>
  </g>

  <path class="catchLight" d="M 106 61 H 1094" stroke-width="1" filter="url(#softBlur)"/>

  <g clip-path="url(#panelClipBack)">
    <g transform="skewX(-20)">
      <rect x="-260" y="30" width="70" height="260" fill="url(#shimmerGradBack)">
        <animateTransform attributeName="transform" type="translate"
                           from="0 0" to="1450 0"
                           begin="0.4s" dur="2.5s"
                           calcMode="spline" keySplines="0.25 0.1 0.25 1"
                           fill="freeze"/>
      </rect>
    </g>
  </g>

  <text class="titleText" x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="600" letter-spacing="0.5">
    capstone-backend
  </text>

  <text class="subText" x="600" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15">
    The Week 5 modules, wired into a live API and a working dashboard.
  </text>

  <rect class="accentBar" x="558" y="205" width="84" height="2" rx="1"/>

  <text class="metaText" x="600" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" letter-spacing="0.5">
    Python · FastAPI · Uvicorn · SQLAlchemy · Streamlit · weeks 6-7 of the internship
  </text>
</svg>
